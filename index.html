<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sinais Aviator VIP - Hacker Mode</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');
    
    body {
      background-color: #030403;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Animação para entrada de novos cards */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-12px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-animate {
      animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Brilho customizado */
    .glow-gold {
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.35);
    }

    .glow-green {
      box-shadow: 0 0 18px rgba(37, 211, 102, 0.45);
    }

    /* Fundo Hacker Matrix */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 relative pb-32">

  <!-- Canvas do Fundo Hacker (Algoritmos Verdes Subindo) -->
  <canvas id="matrix-canvas"></canvas>

  <!-- Header -->
  <header class="flex flex-col items-center justify-center mt-2 mb-6 space-y-1 z-20">
    <div class="flex items-center space-x-2">
      <span class="relative flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
      </span>
      <span class="text-[10px] font-black uppercase tracking-widest text-emerald-400 bg-emerald-950/80 border border-emerald-500/40 px-2.5 py-0.5 rounded-full shadow-[0_0_10px_rgba(16,185,129,0.3)]">
        Algoritmo Ativo
      </span>
    </div>

    <div class="flex items-center space-x-2 pt-1">
      <h1 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-[#ebd399] via-[#c2a675] to-[#8c7143] drop-shadow">
        SINAIS AVIATOR
      </h1>
      <span class="text-2xl">🛫</span>
    </div>
  </header>

  <!-- Grid de Cards de Sinais -->
  <main id="cards-container" class="grid grid-cols-2 gap-3.5 max-w-md mx-auto w-full z-20">
    <!-- Cards injetados via JS -->
  </main>

  <!-- Barra Fixa Inferior com Botões -->
  <div class="fixed bottom-4 left-0 right-0 px-4 z-50">
    <div class="max-w-md mx-auto relative w-full flex items-center">
      
      <!-- Botão Principal de Cadastro -->
      <a
        href="https://go.aff.nicebetpartners.com/fz9l3p1c"
        target="_blank"
        rel="noopener noreferrer"
        class="w-full bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 hover:brightness-110 text-black font-black py-4 rounded-2xl uppercase tracking-wider text-sm shadow-2xl glow-gold active:scale-[0.98] transition-all duration-200 text-center block pr-28 border border-yellow-300/40"
      >
        CRIAR CONTA AGORA
      </a>

      <!-- Botão Flutuante VIP WhatsApp -->
      <a
        href="https://chat.whatsapp.com/B7NKLUFbXWnLay0WVWyXBY"
        target="_blank"
        rel="noopener noreferrer"
        class="absolute right-2 bg-gradient-to-r from-emerald-500 to-green-600 hover:brightness-110 text-white font-extrabold py-2.5 px-3.5 rounded-full flex items-center space-x-1.5 shadow-xl glow-green active:scale-95 transition-all duration-200 border border-emerald-400/30"
      >
        <svg class="w-4 h-4 fill-current drop-shadow" viewBox="0 0 24 24">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99 0-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-1.157 4.228 4.242-1.112z" />
        </svg>
        <span class="text-[11px] font-black tracking-wider uppercase whitespace-nowrap drop-shadow">GRUPO VIP</span>
      </a>

    </div>
  </div>

  <!-- Script do Efeito Hacker e Lógica de Sinais -->
  <script>
    // --- EFECTO HACKER (MATRIX SUBINDO) ---
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '0123456789ABCDEFGHJKMNPQRSTVWXYZ<>[]=/{}*+#$X';
    const fontSize = 14;
    const columns = Math.floor(canvas.width / fontSize);
    
    // Inicia os cursores na parte inferior para subirem
    const drops = Array.from({ length: columns }, () => Math.floor(Math.random() * canvas.height / fontSize));

    function drawMatrix() {
      // Cria o rastro de desvanecimento escuro
      ctx.fillStyle = 'rgba(3, 4, 3, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = `${fontSize}px 'JetBrains Mono', monospace`;

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        
        // Cor do texto verde hacker com variação de brilho
        const isBright = Math.random() > 0.85;
        ctx.fillStyle = isBright ? '#a7f3d0' : '#10b981';
        
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillText(text, x, y);

        // Move a posição PARA CIMA
        if (y < 0 && Math.random() > 0.96) {
          drops[i] = Math.floor(canvas.height / fontSize);
        } else {
          drops[i]--;
        }
      }
    }

    setInterval(drawMatrix, 40);

    // --- LÓGICA DE GERAÇÃO DE SINAIS ---
    let cardData = [];

    function generateSignal(offsetMinutes = 0) {
      const now = new Date(Date.now() - offsetMinutes * 60000);
      const time = now.toTimeString().split(' ')[0];

      const rand = Math.random() * 100;
      let label, value, protecao, bgStyle, shadowGlow, icon;

      if (rand < 25) {
        // 25% Rosa (> 10.00X)
        label = 'Rosa';
        value = (10 + Math.random() * 40).toFixed(2) + 'X';
        protecao = '8.00X';
        bgStyle = 'bg-gradient-to-r from-pink-600 via-rose-500 to-pink-600 text-white';
        shadowGlow = 'shadow-[0_0_15px_rgba(225,29,72,0.3)] border-pink-500/30';
        icon = '🌹';
      } else if (rand < 60) {
        // 35% Azul (< 2.00X)
        label = 'Azul';
        const valNum = 1.1 + Math.random() * 0.89;
        value = valNum.toFixed(2) + 'X';
        protecao = (valNum - 0.15).toFixed(2) + 'X';
        bgStyle = 'bg-gradient-to-r from-sky-600 via-cyan-600 to-blue-600 text-white';
        shadowGlow = 'shadow-[0_0_15px_rgba(2,132,199,0.3)] border-sky-500/30';
        icon = '💙';
      } else {
        // 40% Roxo (2.00X ate 9.99X)
        label = 'Roxo';
        value = (2 + Math.random() * 7.99).toFixed(2) + 'X';
        protecao = '2.00X';
        bgStyle = 'bg-gradient-to-r from-purple-600 via-violet-600 to-purple-700 text-white';
        shadowGlow = 'shadow-[0_0_15px_rgba(147,51,234,0.3)] border-purple-500/30';
        icon = '💜';
      }

      return { time, label, value, protecao, bgStyle, shadowGlow, icon };
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      cardData.forEach((item, index) => {
        const isLatest = index === cardData.length - 1;
        const cardHtml = `
          <div class="bg-[#0b0f0c]/90 rounded-2xl p-3 flex flex-col items-center border border-emerald-900/40 shadow-xl backdrop-blur-md relative overflow-hidden ${isLatest ? 'card-animate' : ''}">
            <!-- Horário -->
            <span class="text-[#c2a675] font-extrabold text-xs tracking-wider mb-2 flex items-center gap-1">
              <svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              ${item.time}
            </span>

            <!-- Badge Central Colorida -->
            <div class="w-full py-2.5 rounded-xl flex flex-col items-center justify-center font-black text-center border ${item.bgStyle} ${item.shadowGlow}">
              <div class="flex items-center space-x-1 text-[11px] opacity-90">
                <span>${item.icon}</span>
                <span class="uppercase tracking-wide">${item.label}</span>
              </div>
              <span class="text-xl font-black leading-tight tracking-tight drop-shadow-md">
                ${item.value}
              </span>
            </div>

            <!-- Proteção -->
            <div class="mt-2 text-[10px] text-zinc-400 font-semibold tracking-wider">
              PROTEÇÃO: <span class="text-zinc-100 font-black">${item.protecao}</span>
            </div>
          </div>
        `;
        container.innerHTML += cardHtml;
      });
    }

    function init() {
      for (let i = 7; i >= 0; i--) {
        cardData.push(generateSignal(i * 1.5));
      }
      renderCards();

      setInterval(() => {
        cardData.shift();
        cardData.push(generateSignal(0));
        renderCards();
      }, 60000);
    }

    window.onload = init;
  </script>
</body>
</html>
